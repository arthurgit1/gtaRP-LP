<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidade Alta RP - Demo</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="parallax-bg"></div>

    <!-- Ícones decorativos -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="icon1" class="floating-icon icon1">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="icon2" class="floating-icon icon2">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="icon3" class="floating-icon icon3">

    <div class="hero-content">
      <h1>Bem-vindo ao Cidade Alta RP</h1>
      <p>O maior servidor de Roleplay do Brasil, com a experiência mais imersiva.</p>
      <a href="#como-jogar" class="btn-primary">Começar Agora</a>
    </div>
  </section>

  <!-- SEÇÃO EXTRA -->
  <section id="como-jogar">
    <h2>Como Jogar</h2>
    <p>Baixe o FiveM, crie sua conta e entre na cidade para viver sua história.</p>
  </section>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
